<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">

    <title>Galerija - Soling d.o.o.</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <style>
        /* Reset stila */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #FDF5E6;
            color: #000000;
        }

        header {
            position: relative;
            width: 100%;
            height: 50vh;
            background: url('images/NASLOVNA.jpg') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        header h1 {
            font-size: 7rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }

        h2 {
            color: #8B0000;
            font-size: 3rem;
        }

        nav {
            background: #DAA520;
            color: white;
            padding: 0.5rem;
        }

        nav ul {
            display: flex;
            justify-content: center;
            list-style: none;
        }

        nav ul li {
            margin: 0 3rem;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 1.4rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.5s ease;
        }

        nav ul li a:hover {
            color: #8B0000;
            font-size: 1.5rem;
        }

        main {
            padding: 2rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        figure {
            margin: 0;
            text-align: center;
        }

        img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        img:hover {
            transform: scale(1.05);
        }

        figcaption {
            margin-top: 1rem;
            font-size: 1.1rem;
            color: #555;
        }

        footer {
            background-color: #DAA520;  /* Isto kao izbornik */
            padding: 2rem;
            text-align: center;
            color: white;
        }

        footer .footer-content {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        footer .social-links {
            display: flex;
            justify-content: center;
            gap: 1.0rem;
            margin-top: 1rem;
        }

        footer .social-links a {
            font-size: 3rem;
            color: white;  /* Bijela boja ikona */
            transition: transform 0.5s ease, color 0.3s ease;
        }

        footer .social-links a:hover {
            transform: scale(1.8);  /* Efekt povećanja ikona */
            color: #8B0000;  /* Promjena boje na hover */
        }

        footer .footer-text {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 1rem;
            transition: color 0.5s ease;
        }

        footer .footer-text p {
            font-size: 1rem;
            color: white;
            margin-top: 1rem;
        }

        footer .footer-text:hover {
            color: #8B0000;
        }

        footer .footer-text a {
            font-size: 2rem;
            color: white;
            text-decoration: none;
        }

        footer .footer-text a:hover {
            color: #8B0000;
        }

        footer .footer-text:hover {
            color: #8B0000;  /* Promjena boje cijelog reda */
        }
    </style>
</head>
