<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Soling d.o.o. - Keramičarski radovi, postavljanje pločica, renovacije i izrada keramike za dom i poslovne prostore."> 
    <meta name="keywords" content="keramika, pločice, keramičarski radovi, postavljanje pločica, renovacije, Soling d.o.o."> 
    <meta name="author" content="Valentina Solin"> 
    <title>Soling d.o.o.</title>

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <style>
        /* Reset stila */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #FAEBD7; /* Postavljanje boje pozadine na #d2b48c */
            color: #fff; /* Bijela boja za tekst za dobar kontrast */
        }

        header {
            position: relative;
            width: 100%;
            height: 50vh;
            background-image: url('images/NASLOVNA.jpg'); /* Slika kao pozadina */
            background-repeat: no-repeat;
            background-size: cover; /* Slika se prostire na cijeli prostor */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        header h1 {
            font-size: 7rem;
            text-shadow: 2px 2px 12px rgba(0, 0, 0, 0.9);
        }

        nav {
            background: #DAA520;
            color: white;
            padding: 0.5rem;
        }

        nav ul {
            display: flex;
            justify-content: center;
            list-style: none;
        }

        nav ul li {
            margin: 0 3rem;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 1.4rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.5s ease;
        }

        nav ul li a:hover {
            color: #8B0000; /* Krem-smeđa boja prilikom hover-a */
            font-size: 1.5rem;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 3rem;
            }

            nav ul {
                flex-direction: row;
                justify-content: space-evenly;
            }

            nav ul li {
                margin: 0.5rem;
            }
        }

    </style>
</head>
<body>
    <header>
        <h1>Soling d.o.o.</h1>
    </header>
    <nav>
        <ul>
            <li><a href="#">Novosti</a></li>
            <li><a href="#">O nama</a></li>
            <li><a href="#">Galerija</a></li>
            <li><a href="#">Kontakt</a></li>
        </ul>
    </nav>
    <main>
        <p>Dobrodošli na stranicu keramičarske tvrtke. Stranica je u izradi...</p>
    </main>
    <footer>
        <p>Copyright &copy; 2025. Valentina Solin</p>
    </footer>
</body>
</html>
